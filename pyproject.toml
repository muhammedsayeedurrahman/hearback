[project]
name = "hearback"
version = "0.1.0"
description = "Handover firewall: full-duplex voice agent that guarantees what was heard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "livekit-agents[deepgram,rime,silero,turn-detector]~=1.5",
    "livekit-api>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "api*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
